<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Times Tables Dojo</title>
<style>
:root{
  --ink:#111111; --gold:#C9A227; --goldbg:#FBF5E1; --warn:#C0392B; --warnbg:#FDEDEC;
  --note:#6B7280; --exbg:#F4F6F8; --line:#D9DDE3; --good:#1E8449; --goodbg:#E9F7EF; --bg:#FFFFFF;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:17px;line-height:1.45}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
button{font:inherit;cursor:pointer}
i.v{font-style:italic;font-family:"Times New Roman",Times,serif;font-size:1.1em;padding:0 .02em}
sup{font-size:.6em;line-height:0}

/* banner */
.banner{background:var(--ink);border-radius:10px;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;cursor:pointer}
.banner .l1{color:var(--gold);font-weight:700;letter-spacing:.42em;font-size:15px}
.banner .l2{color:#fff;font-weight:800;font-size:40px;line-height:1;letter-spacing:.02em}
.banner .r{text-align:right}
.banner .r1{color:var(--gold);font-weight:700;font-size:17px}
.banner .r2{color:#fff;font-size:14px}

/* home */
.intro{margin:16px 2px 10px}
.ladder{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(5,auto);column-gap:16px;margin-top:8px}
.tile{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.tile:hover{border-color:var(--ink)}
.tile .num{flex:0 0 auto;background:var(--ink);color:var(--gold);font-weight:700;border-radius:5px;padding:2px 0;font-size:14px;width:30px;text-align:center}
.belt{flex:0 0 auto;display:inline-block;width:34px;height:12px;border-radius:3px;border:1.5px solid var(--ink);vertical-align:middle;margin-right:6px}
.tile .belt{margin-right:0}
.tile .nm{flex:1;font-size:15px;line-height:1.3}
.tile .nm .d{font-size:14px;color:var(--note)}
.nw{white-space:nowrap}
.tile .best{flex:0 0 auto;color:var(--note);font-size:14px;white-space:nowrap}
.tile.done{background:var(--goldbg);border-color:var(--gold)}
.tile.done .best{color:var(--ink);font-weight:700}
.summary{margin:18px 2px 0;font-size:14px;color:var(--note);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.linkbtn{background:none;border:none;color:var(--note);text-decoration:underline;padding:0;font-size:14px}

/* quiz */
.quiz{max-width:560px;margin:16px auto 0;text-align:center}
.qtop{display:flex;align-items:center;gap:10px}
.bar{position:relative;flex:1;height:24px;border-radius:12px;background:var(--exbg);border:1.5px solid var(--line);overflow:hidden}
.bar .fill{height:100%;background:var(--gold);transition:width .2s ease}
.bar .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.quit{background:#fff;border:1.5px solid var(--ink);border-radius:6px;padding:3px 12px;font-size:14px}
.levelname{font-size:14px;color:var(--note);margin-top:8px}
.score{font-size:20px;font-weight:700;margin:6px 0}
.question{font-size:46px;font-weight:700;margin:10px 0 14px;min-height:64px;transition:color .2s;white-space:nowrap}
.question.correct{color:var(--good)}
.question.incorrect{color:var(--warn)}
.answer{display:flex;justify-content:center;align-items:baseline;min-height:64px;font-size:38px;font-weight:700;border:2px solid var(--ink);border-radius:8px;padding:6px 14px;margin:0 auto 12px;max-width:320px;outline:none}
.answer:focus{box-shadow:0 0 0 3px var(--goldbg),0 0 0 5px var(--gold)}
.seg.active{border-bottom:3px solid var(--gold)}
.seg .ph{color:var(--line)}
.answer .v{font-size:1.15em}
/* the index box: raised and small, like a real index, so pupils see z² and not z2 */
.answer .idx{position:relative;top:-.75em;display:inline-block;font-size:.55em;min-width:1.2em;height:1.35em;line-height:1.2em;margin-left:3px;padding:0 .15em;text-align:center;border:2px dashed var(--gold);border-radius:4px;background:var(--goldbg)}
.answer .idx.filled{border-style:solid}
.keypad{max-width:320px;margin:0 auto}
.keypad .letters{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.keypad .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keypad button{background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:10px 0;font-size:22px;font-weight:700}
.keypad button:hover{border-color:var(--ink)}
.keypad .letters button{font-family:"Times New Roman",Times,serif;font-style:italic;background:var(--goldbg);border-color:var(--gold)}
.keypad .enter{width:100%;margin-top:6px;background:var(--ink);color:#fff;border-color:var(--ink);font-size:19px}
.hint{font-size:13px;color:var(--note);margin-top:10px}

/* results */
.results{max-width:640px;margin:16px auto 0;text-align:center}
.results h2{margin:4px 0 12px}
.pb{background:var(--ink);color:var(--gold);border-radius:8px;padding:8px 14px;font-weight:700;margin-bottom:12px}
.pb .belt{border-color:var(--gold)}
.nearly{background:var(--goldbg);border:1px solid var(--gold);border-radius:8px;padding:8px 14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--exbg);border-radius:8px;padding:10px}
.stat .val{display:block;font-size:28px;font-weight:800}
.stat .lab{font-size:14px;color:var(--note)}
.review{text-align:left;background:var(--warnbg);border:1px solid var(--warn);border-radius:8px;padding:8px 14px;margin-bottom:14px}
.review h3{margin:2px 0 6px;font-size:17px;color:var(--warn)}
.review ul{margin:0;padding-left:20px}
.review li{margin:3px 0}
.allright{background:var(--goodbg);border:1px solid var(--good);color:var(--good);border-radius:8px;padding:8px 14px;font-weight:700;margin-bottom:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.actions button{background:#fff;border:1.5px solid var(--ink);border-radius:6px;padding:8px 16px;font-size:15px}
.actions button.primary{background:var(--ink);color:#fff}

@media (max-width:820px){
  .ladder{grid-template-columns:1fr;grid-auto-flow:row;grid-template-rows:none}
  .banner .l2{font-size:32px}
  .question{font-size:36px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="banner" id="home-link" title="Back to all levels">
    <div><div class="l1">TIMES TABLES</div><div class="l2">DOJO</div></div>
    <div class="r"><div class="r1">EARN YOUR BELTS</div><div class="r2">From white belt to master</div></div>
  </div>
  <div id="home"></div>
  <div id="quiz" hidden></div>
  <div id="results" hidden></div>
</div>

<script>
"use strict";
/* ================= decimal-safe numbers =================
   A value is {base, scale} meaning base × 10^scale, with base a whole number.
   All sums are done on whole numbers and formatted as strings, so answers like
   0.9 × 6 = 5.4 are always exact (no 0.1 + 0.2 floating-point slips). */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const mul=(a,b)=>({base:a.base*b.base,scale:a.scale+b.scale});

function fmt(v){
  let d=String(Math.abs(v.base));
  if(v.scale>=0)return d+'0'.repeat(v.scale);
  const shift=-v.scale;
  if(shift>=d.length)d='0'.repeat(shift-d.length+1)+d;
  const cut=d.length-shift,frac=d.slice(cut).replace(/0+$/,'');
  return d.slice(0,cut)+(frac?'.'+frac:'');
}

// "5.40", "05.4" and "5.4" all become "5.4"; anything that isn't a plain
// decimal number becomes null.
function normalise(s){
  const m=/^(\d+)(?:\.(\d*))?$/.exec(s.trim());
  if(!m)return null;
  const whole=m[1].replace(/^0+(?=\d)/,''),frac=(m[2]||'').replace(/0+$/,'');
  return whole+(frac?'.'+frac:'');
}

/* ================= question generators =================
   Each question is {text, answer:{coefficient, letter, exponent}}; letter and
   exponent are null for plain number answers. */
const num=(coefficient)=>({coefficient,letter:null,exponent:null});

function classic(level){
  const [lo,hi]={bronze:[2,5],silver:[2,9],gold:[2,12]}[level];
  const a=ri(lo,hi),b=ri(lo,hi);
  return {text:`${a} × ${b}`,answer:num(String(a*b))};
}

const DEC={level1:[-1],level2:[-1],level3:[-2,-1],level4:[-2,-1]};
const MULT={level1:[1],level2:[1],level3:[1,2],level4:[1,2]};
function scaledPair(level){
  // Levels 1 and 3: one factor scaled, one whole. Levels 2 and 4: both scaled,
  // either both decimals or both multiples of ten, never one of each.
  if(level==='level2'||level==='level4'){
    const g=pick([DEC[level],MULT[level]]);
    return [{base:ri(2,12),scale:pick(g)},{base:ri(2,12),scale:pick(g)}];
  }
  const s={base:ri(2,12),scale:pick([...DEC[level],...MULT[level]])},w={base:ri(2,12),scale:0};
  return Math.random()<.5?[s,w]:[w,s];
}
function scaled(level){
  const [a,b]=scaledPair(level);
  if(Math.random()<.5)return {text:`${fmt(a)} × ${fmt(b)}`,answer:num(fmt(mul(a,b)))};
  // a ÷ question built backwards from its answer, so it always divides exactly
  return {text:`${fmt(mul(a,b))} ÷ ${fmt(b)}`,answer:num(fmt(a))};
}

const LETTERS=['x','y','z'];
function termHTML(t,letter){
  const c=fmt(t.coeff);
  if(t.exp===0)return c;
  // 1x is written x
  return `${c==='1'?'':c}<i class="v">${letter}</i>${t.exp===1?'':`<sup>${t.exp}</sup>`}`;
}
const randTerm=(scales,exp)=>({coeff:{base:ri(2,12),scale:pick(scales)},exp});
const termAnswer=(t,letter)=>({coefficient:fmt(t.coeff),letter:t.exp?letter:null,exponent:t.exp||null});
function algMultiply(scales,e1,e2,letter){
  const [a,b]=Math.random()<.5?[e1,e2]:[e2,e1];
  const t1=randTerm(scales,a),t2=randTerm(scales,b);
  return {text:`${termHTML(t1,letter)} × ${termHTML(t2,letter)}`,
          answer:termAnswer({coeff:mul(t1.coeff,t2.coeff),exp:t1.exp+t2.exp},letter)};
}
function algDivide(scales,qExp,dExp,letter){
  const q=randTerm(scales,qExp),d=randTerm(scales,dExp);
  const dividend={coeff:mul(q.coeff,d.coeff),exp:q.exp+d.exp};
  return {text:`${termHTML(dividend,letter)} ÷ ${termHTML(d,letter)}`,answer:termAnswer(q,letter)};
}
function algebra(level){
  const letter=pick(LETTERS);
  if(level==='bronze')return algMultiply([0],0,1,letter);
  if(level==='silver')return algMultiply([-1,0,1],1,1,letter);
  const scales=[-2,-1,0,1,2];
  if(Math.random()<.5)return algMultiply(scales,1,1,letter);
  return algDivide(scales,1,Math.random()<.5?0:1,letter);
}

// The belts, easiest first. Every belt is open from the start, so a teacher
// can send a pupil straight to the one they're working on. `secs` is the
// average time per answer a round must beat to earn the belt: 6 seconds for
// plain tables, the same as the Multiplication Tables Check, and longer for
// the belts with decimals or letters, which take more keypresses.
const BELTS=[
  {id:'white', name:'White', colour:'#FFFFFF',gen:()=>classic('bronze'),secs:6,desc:'2 to 5 times tables'},
  {id:'yellow',name:'Yellow',colour:'#F4D03F',gen:()=>classic('silver'),secs:6,desc:'2 to 9 times tables'},
  {id:'orange',name:'Orange',colour:'#E67E22',gen:()=>classic('gold'),  secs:6,desc:'2 to 12 times tables'},
  {id:'green', name:'Green', colour:'#28B463',gen:()=>scaled('level1'), secs:8,desc:'One number ×10 or ×0.1'},
  {id:'blue',  name:'Blue',  colour:'#2E86C1',gen:()=>scaled('level2'), secs:8,desc:'Both numbers ×10, or both ×0.1'},
  {id:'purple',name:'Purple',colour:'#7D3C98',gen:()=>algebra('bronze'),secs:8,desc:'Number × letter, e.g. 3 × 4<i class="v">x</i>'},
  {id:'brown', name:'Brown', colour:'#8B5A2B',gen:()=>scaled('level3'), secs:10,desc:'One number ×100 down to ×0.01'},
  {id:'red',   name:'Red',   colour:'#C0392B',gen:()=>scaled('level4'), secs:10,desc:'Both numbers ×100 down to ×0.01'},
  {id:'black', name:'Black', colour:'#111111',gen:()=>algebra('silver'),secs:10,desc:'Letter × letter, with decimals'},
  {id:'master',name:'Master',colour:'#C9A227',gen:()=>algebra('gold'),  secs:10,desc:'Multiply and divide with letters'},
];
const beltById=Object.fromEntries(BELTS.map(b=>[b.id,b]));
const beltName=b=>b.id==='master'?'Master belt':b.name+' belt';

/* ================= marking ================= */
function isCorrect(exp,sub){
  // a bare letter, e.g. x, means 1x
  if(sub.coefficient===''&&sub.letter!=='')sub={...sub,coefficient:'1'};
  if(normalise(sub.coefficient)!==normalise(exp.coefficient)||normalise(exp.coefficient)===null)return false;
  if(exp.letter===null)return sub.letter==='';
  if(sub.letter!==exp.letter)return false;
  // a power of 1 doesn't need to be typed in
  if(exp.exponent===1)return sub.exponent===''||sub.exponent==='1';
  return sub.exponent===String(exp.exponent);
}
function answerHTML(a){
  if(!a.letter)return a.coefficient;
  return `${a.coefficient==='1'?'':a.coefficient}<i class="v">${a.letter}</i>${a.exponent>1?`<sup>${a.exponent}</sup>`:''}`;
}
function submittedHTML(s){
  if(!s.coefficient&&!s.letter)return '(nothing)';
  if(!s.letter)return s.coefficient;
  return `${s.coefficient}<i class="v">${s.letter}</i>${s.exponent?`<sup>${s.exponent}</sup>`:''}`;
}

/* ================= best scores (this browser only) ================= */
const STORE='times-tables-dojo-v3'; // v3: belts need a fast enough average time
let best={};
try{best=JSON.parse(localStorage.getItem(STORE))||{}}catch(e){best={}}
const saveBest=()=>{try{localStorage.setItem(STORE,JSON.stringify(best))}catch(e){}};

/* ================= pages ================= */
const QUESTIONS=10,TO_EARN=8;
const $=id=>document.getElementById(id);
function show(id){for(const p of ['home','quiz','results'])$(p).hidden=p!==id;window.scrollTo(0,0)}
// best[id] is the pupil's best round on that belt: {right, avg, earned}
const earned=id=>!!best[id]?.earned;
const better=(a,b)=>!b||a.earned!==b.earned?a.earned||!b:a.right!==b.right?a.right>b.right:a.avg<b.avg;
const swatch=b=>`<span class="belt" style="background:${b.colour}"></span>`;

function renderHome(){
  let h=`<p class="intro">Everyone starts at <b>white belt</b> and works their way up. To earn a belt, get <b>${TO_EARN} out of ${QUESTIONS}</b> right with an average time of <b>⏱ 6 seconds</b> or less per question (a bit longer for the harder belts), then have a go at the next belt. Type your answer or use the keypad. For answers with a letter, type the number, then the letter. A small box pops up for the index: type it in, or leave it empty if there isn’t one. So for 12<i class="v">x</i><sup>2</sup>, type <b>12</b>, <b><i class="v">x</i></b>, <b>2</b>.</p><div class="ladder">`;
  BELTS.forEach((b,i)=>{
    const s=best[b.id];
    h+=`<button class="tile${earned(b.id)?' done':''}" data-b="${b.id}"><span class="num">${i+1}</span>${swatch(b)}<span class="nm"><b>${beltName(b)}</b><br><span class="d">${b.desc} · <span class="nw">⏱ ${b.secs}s average</span></span></span><span class="best">${s==null?'':earned(b.id)?'✔ Earned':'Best '+s.right+'/'+QUESTIONS+' · '+s.avg.toFixed(1)+'s'}</span></button>`;
  });
  const n=BELTS.filter(b=>earned(b.id)).length;
  h+=`</div><div class="summary"><span>${n} / ${BELTS.length} belts earned on this device</span><button class="linkbtn" id="reset">Reset my belts</button></div>`;
  $('home').innerHTML=h;
  $('home').querySelectorAll('.tile').forEach(t=>t.onclick=()=>startQuiz(t.dataset.b));
  $('reset').onclick=()=>{if(confirm('Clear all your belts and best scores on this device?')){best={};saveBest();renderHome()}};
  show('home');
}

let Q=null; // the round in progress
function startQuiz(beltId){
  const belt=beltById[beltId];
  Q={belt,results:[],q:belt.gen(),
     ans:{coefficient:'',letter:'',exponent:''},qStart:Date.now(),flash:null,done:false};
  show('quiz');
  drawQuiz();
  $('ansbox').focus();
}

function drawQuiz(){
  const n=Q.results.length,right=Q.results.filter(r=>r.ok).length;
  const hasVar=Q.q.answer.letter!==null,a=Q.ans,onPower=hasVar&&a.letter!=='';
  const coeff=a.coefficient||(a.letter?'':'<span class="ph">0</span>');
  const power=a.letter?`<i class="v">${a.letter}</i><span class="idx${a.exponent?' filled':''}" aria-label="index">${a.exponent}</span>`:'';
  $('quiz').innerHTML=`<div class="quiz">
    <div class="qtop"><div class="bar"><div class="fill" style="width:${n/QUESTIONS*100}%"></div><div class="lbl">Question ${n+1} / ${QUESTIONS}</div></div><button class="quit" id="quit">Quit</button></div>
    <div class="levelname">${swatch(Q.belt)}${beltName(Q.belt)}</div>
    <div class="score">${right} / ${n}</div>
    <div class="question ${Q.flash||''}">${Q.q.text}</div>
    <div class="answer" id="ansbox" tabindex="0" role="textbox" aria-label="Your answer"><span class="seg${onPower?'':' active'}">${coeff}</span>${power}</div>
    <div class="keypad">
      ${hasVar?`<div class="letters">${LETTERS.map(l=>`<button data-k="${l}">${l}</button>`).join('')}</div>`:''}
      <div class="grid">${['7','8','9','4','5','6','1','2','3','.','0','Backspace'].map(k=>`<button data-k="${k}">${k==='Backspace'?'⌫':k}</button>`).join('')}</div>
      <button class="enter" data-k="Enter">Enter</button>
    </div>
    <div class="hint">${!hasVar?'You can type on the keyboard too.':onPower?'Type the index in the small box, or press Enter if there isn’t one.':'Type the number, then the letter.'}</div>
  </div>`;
  $('quit').onclick=()=>{Q.done=true;renderHome()};
  $('quiz').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{key(b.dataset.k);$('ansbox').focus()});
}

const MAX_COEFF=7,MAX_POWER=2;
function key(k){
  if(!Q||Q.done)return;
  const a=Q.ans,hasVar=Q.q.answer.letter!==null,onPower=hasVar&&a.letter!=='';
  if(k==='Enter')return submit();
  if(k==='Backspace'){
    if(onPower){if(a.exponent)a.exponent=a.exponent.slice(0,-1);else a.letter=''}
    else a.coefficient=a.coefficient.slice(0,-1);
  }else if(/^[0-9]$/.test(k)){
    if(onPower){if(a.exponent.length<MAX_POWER)a.exponent+=k}
    else if(a.coefficient.length<MAX_COEFF)a.coefficient+=k;
  }else if(k==='.'){
    if(!onPower&&!a.coefficient.includes('.'))a.coefficient+='.';
  }else if(/^[a-zA-Z]$/.test(k)){
    if(hasVar&&!onPower){a.letter=k.toLowerCase();a.exponent=''}
  }else return;
  drawQuiz();
  $('ansbox').focus();
}

function submit(){
  if(Q.ans.coefficient===''&&Q.ans.letter==='')return;
  const ok=isCorrect(Q.q.answer,Q.ans);
  Q.results.push({text:Q.q.text,expected:answerHTML(Q.q.answer),given:submittedHTML(Q.ans),ok,ms:Date.now()-Q.qStart});
  if(Q.results.length>=QUESTIONS){Q.done=true;return renderResults()}
  Q.flash=ok?'correct':'incorrect';
  const round=Q;
  setTimeout(()=>{if(Q===round&&!round.done){round.flash=null;drawQuiz();$('ansbox').focus()}},350);
  Q.q=Q.belt.gen();
  Q.ans={coefficient:'',letter:'',exponent:''};
  Q.qStart=Date.now();
  drawQuiz();
  $('ansbox').focus();
}

document.addEventListener('keydown',e=>{
  if($('quiz').hidden)return;
  if(/^[0-9.]$|^[a-zA-Z]$|^(Enter|Backspace)$/.test(e.key)&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    e.preventDefault();
    key(e.key);
  }
});

function renderResults(){
  const r=Q.results,belt=Q.belt,right=r.filter(x=>x.ok).length;
  // rounded to match the average shown, so 6.0s always counts as 6 seconds or less
  const avg=Math.round(r.reduce((s,x)=>s+x.ms,0)/r.length/100)/10;
  const fastEnough=avg<=belt.secs,passed=right>=TO_EARN&&fastEnough;
  const hadBelt=earned(belt.id),round={right,avg,earned:passed||hadBelt};
  const newBest=better(round,best[belt.id])&&best[belt.id]!=null;
  if(better(round,best[belt.id])){best[belt.id]=round;saveBest()}
  const wrong=r.filter(x=>!x.ok);
  const next=BELTS[BELTS.indexOf(belt)+1];
  const target=`${TO_EARN} right with an average of ${belt.secs} seconds or less`;
  let banner;
  if(passed&&!hadBelt)banner=`<div class="pb">${swatch(belt)}You've earned your ${beltName(belt)}!</div>`;
  else if(passed)banner=newBest?'<div class="pb">New best on this device!</div>':'';
  else if(right>=TO_EARN)banner=`<div class="nearly">You got <b>${right} right</b>. Now work on your speed! Your average was <b>${avg.toFixed(1)}s</b>. Get ${target} to earn your ${beltName(belt)}.</div>`;
  else banner=`<div class="nearly">Get ${target} to earn your ${beltName(belt)}. Every round is practice, so have another go!</div>`;
  $('results').innerHTML=`<div class="results">
    <h2>Round complete!</h2>
    ${banner}
    <div class="stats">
      <div class="stat"><span class="val">${right} / ${r.length}</span><span class="lab">Correct</span></div>
      <div class="stat"><span class="val">${avg.toFixed(1)}s</span><span class="lab">Average per question</span></div>
      <div class="stat"><span class="val">${belt.secs}s</span><span class="lab">Belt target</span></div>
    </div>
    ${wrong.length?`<div class="review"><h3>Have another look at these</h3><ul>${wrong.map(x=>`<li><b>${x.text}</b>: you answered ${x.given}, the answer was <b>${x.expected}</b></li>`).join('')}</ul></div>`
      :'<div class="allright">Every question right. Brilliant!</div>'}
    <div class="actions">${passed&&next?`<button class="primary" id="next">Try the ${beltName(next)} ▶</button><button id="again">🔁 Play again</button>`:'<button class="primary" id="again">🔁 Play again</button>'}<button id="levels">Choose another belt</button></div>
  </div>`;
  $('again').onclick=()=>startQuiz(belt.id);
  if($('next'))$('next').onclick=()=>startQuiz(next.id);
  $('levels').onclick=renderHome;
  show('results');
}

$('home-link').onclick=()=>{if(Q)Q.done=true;renderHome()};
renderHome();
</script>
</body>
</html>
